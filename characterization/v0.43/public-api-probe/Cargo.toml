[package]
name = "fiet-rindexer-v043-public-api-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
alloy = { version = "=2.0.4", features = ["full"] }
rindexer = { path = "../../../core" }
serde_yaml = "=0.9.34"

[dev-dependencies]
rustls = { version = "0.23", features = ["ring"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
