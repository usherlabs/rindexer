name: Downstream governance

on:
  workflow_dispatch:
    inputs:
      release_validation:
        description: Reject pending audit items and validate the recorded release tag
        required: true
        default: false
        type: boolean
  push:
    branches:
      - "fiet/v0.43"
  pull_request:
    branches:
      - "fiet/v0.43"

permissions:
  contents: read

jobs:
  governance:
    name: Downstream governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare immutable v0.43 characterization worktree
        run: >-
          git worktree add --detach
          "$RUNNER_TEMP/rindexer-v043-characterization"
          de028ae38e1246b74e48e914cb2f34f17af56d64

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate governance JSON schemas
        run: |
          npx --yes ajv-cli@5.0.0 validate --spec=draft2020 --strict=true \
            -s schemas/downstream-patch-inventory.schema.json \
            -d downstream-patch-inventory.json
          npx --yes ajv-cli@5.0.0 validate --spec=draft2020 --strict=true \
            -s schemas/downstream-patches.schema.json \
            -d downstream-patches.json
          npx --yes ajv-cli@5.0.0 validate --spec=draft2020 --strict=true \
            -s schemas/governed-paths.schema.json \
            -d governed-paths.json
          if test -f characterization/v0.43/vanilla-baseline-receipt.json; then
            npx --yes ajv-cli@5.0.0 validate --spec=draft2020 --strict=true \
              -s schemas/v043-characterization-receipt.schema.json \
              -d characterization/v0.43/vanilla-baseline-receipt.json
          fi
          if test -f qualification/v0.43/candidate-fork-qualification-receipt.json; then
            npx --yes ajv-cli@5.0.0 validate --spec=draft2020 --strict=true \
              -s schemas/v043-fork-qualification-receipt.schema.json \
              -d qualification/v0.43/candidate-fork-qualification-receipt.json
          fi

      - name: Run governance regression tests
        run: >-
          python3 -m unittest
          scripts/test_downstream_governance.py
          scripts/test_canonical_drift.py
          scripts/test_canonical_contribution.py
          scripts/test_seal_v043_characterization.py
          scripts/test_seal_v043_fork_qualification.py

      - name: Run untouched v0.43 characterization regressions
        run: |
          cd "$RUNNER_TEMP/rindexer-v043-characterization"
          python3 -m unittest \
            scripts/test_characterize_v043_baseline.py \
            scripts/test_characterize_v043_process.py

      - name: Characterize untouched v0.43 source behavior
        run: |
          cd "$RUNNER_TEMP/rindexer-v043-characterization"
          python3 scripts/characterize_v043_baseline.py \
            --output "$GITHUB_WORKSPACE/characterization/v0.43/vanilla-baseline-source-receipt.generated.json"

      - name: Run untouched v0.43 public API probes
        run: |
          cd "$RUNNER_TEMP/rindexer-v043-characterization"
          cargo test \
            --locked \
            --manifest-path characterization/v0.43/public-api-probe/Cargo.toml \
            --test vanilla

      - name: Run untouched v0.43 callback crash-window probe
        run: |
          cd "$RUNNER_TEMP/rindexer-v043-characterization"
          cargo test \
            --locked \
            --manifest-path characterization/v0.43/public-api-probe/Cargo.toml \
            --test legacy_callback

      - name: Install Foundry for process characterization
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build untouched v0.43 process probe binary
        run: |
          cd "$RUNNER_TEMP/rindexer-v043-characterization"
          cargo build -p rindexer_cli
          git diff --exit-code -- . ':(exclude)Cargo.lock'
          git restore --source=HEAD -- Cargo.lock
          git diff --exit-code -- Cargo.lock

      - name: Run untouched v0.43 process lifecycle probes
        run: |
          cd "$RUNNER_TEMP/rindexer-v043-characterization"
          python3 scripts/characterize_v043_process.py \
            --binary target/debug/rindexer_cli \
            --anvil "$(command -v anvil)" \
            --output "$GITHUB_WORKSPACE/characterization/v0.43/vanilla-baseline-process-receipt.generated.json"

      - name: Verify sealed characterization evidence
        if: ${{ hashFiles('characterization/v0.43/vanilla-baseline-receipt.json') != '' }}
        run: python3 scripts/seal_v043_characterization.py --verify

      - name: Verify sealed fork qualification evidence
        if: ${{ hashFiles('qualification/v0.43/candidate-fork-qualification-receipt.json') != '' }}
        run: python3 scripts/seal_v043_fork_qualification.py --verify

      - name: Validate baseline, inventory, ledger, ancestry, and governed paths
        run: python3 scripts/validate_downstream_governance.py

      - name: Verify protected default release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)" = "fiet/v0.43"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/fiet%2Fv0.43" --jq .protected)" = "true"

      - name: Validate immutable release identity
        if: ${{ inputs.release_validation }}
        run: >-
          python3 scripts/validate_downstream_governance.py
          --release
          --verify-tag
          --release-remote "https://github.com/${GITHUB_REPOSITORY}.git"
